name: bmw-alert
on:
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ss-alert
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests beautifulsoup4
      - run: python bmw_alert.py
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - name: Save seen_bmw.json
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_bmw.json
          git diff --cached --quiet || (git commit -m "update seen bmw" && git push)
